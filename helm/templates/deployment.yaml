{{ if eq .Values.appKind "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.appReplicas }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
      - name: {{ .Values.appName }}
        image: "{{ .Values.appImage.name }}:{{ .Values.appImage.tag }}"
        ports:
        - containerPort: {{ .Values.appPort }}
        envFrom:
        - configMapRef:
            name: {{ .Values.appName }}
{{- end }}
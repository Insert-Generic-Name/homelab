{{ if eq .Values.appKind "Deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
spec:
  replicas: {{ .Values.appReplicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
      - name: {{ .Values.appName }}
        image: "{{ .Values.appImage.name }}:{{ .Values.appImage.tag }}"
        ports: {{- range .Values.appPorts }}
        - name: {{ .name | default "http" }}
          protocol: {{ .protocol | default "TCP" }}
          containerPort: {{ .targetPort | default .port }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: {{ .Values.appName }}
        volumeMounts: {{- range .Values.appVolumeMounts }}
        - name: {{ .name | default "pvc" }}
          mountPath: {{ .mountPath | default "/data"}}
        {{- end }}
{{- end }}
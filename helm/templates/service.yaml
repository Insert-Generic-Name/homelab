apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  {{- if eq .Values.kind "StatefulSet" }}
  clusterIP: None
  {{- else }}
  type: {{ .Values.serviceType | default "ClusterIP" }}
  {{- end }}
  selector:
    app: {{ .Release.Name }}
  ports: {{- range .Values.ports }}
    - name: {{ .name | default "http" }}
      protocol: {{ .protocol | default "TCP" }}
      port: {{ .port }}
      targetPort: {{ .targetPort | default .port }}
    {{- end }}
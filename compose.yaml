services:
  openbao:
    image: openbao/openbao:latest
    container_name: openbao
    restart: ${RESTART_POLICY}
    # environment:
    #   -
    # volumes:
    #   - ./data:/data
    # expose:
    #   - 80
    networks:
      - obao

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: ${RESTART_POLICY}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_obao_data:/data
      - caddy_obao_config:/config
    networks:
      - obao

volumes:
  caddy_obao_data:
  caddy_obao_config:

networks:
  obao:

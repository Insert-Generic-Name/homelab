[tools]
envsubst = "1.4.3"
flux-operator = "0.57.0"
gum = "2.0.1"
helmfile = "1.7.4"
just = "1.58.0"
kubectl = "1.37.0"
kubelogin = "1.36.4"
lefthook = "2.1.16"
omnictl = "1.11.0"
openbao = "2.6.2"
talosctl = "1.14.0"
terraform = "1.16.1"
yq = "4.53.6"
"github:woodpecker-ci/woodpecker" = "3.18.1"

[env]
BAO_ADDR = "http://127.0.0.1:8200"
BAO_SKIP_VERIFY = true
CLUSTER_NAME = "talops"
KUBECONFIG = "{{config_root}}/kubeconfig"
OMNICONFIG = "{{config_root}}/omniconfig"
TALOSCONFIG = "{{config_root}}/talosconfig"

[settings]
lockfile = true

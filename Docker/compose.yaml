services:
  openbao:
    image: openbao/openbao:latest
    container_name: openbao
    expose:
      - "8200"
    volumes:
      - ./bao/config:/openbao/config
      - ./bao/data:/bao/raft
      - ./bao/logs:/var/log/
    restart: unless-stopped
    command: ["server"]
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

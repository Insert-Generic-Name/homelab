when:
  - event: push
    branch: main
  - event: manual

steps:
  # - name:  secret scanning
  #   image: ghcr.io/gitleaks/gitleaks:latest
  #   commands:
  #     - gitleaks git

  - name: yamllint
    image: alpine:3.24.2
    commands:
      - apk add yamllint
      - yamllint .

  - name: docker compose lint
    image: alpine:3.24.2
    commands:
      - docker compose config
    when:
      - path: "compose.yaml"

  - name: helm schema validation
    image: alpine:latest
    commands:
      - yq eval '.spec.values' release.yaml > values.yaml

  - name: Build FluxCD resources and validate them
    image: ghcr.io/controlplaneio-fluxcd/flux-operator-cli:v0.57.0
    # Shell does not live under /bin/sh which is the default path used by woodpecker
    entrypoint:
      ["/busybox/sh", "-c", "echo $CI_SCRIPT | base64 -d | /busybox/sh -e"]
    commands:
      - flux-operator build rset -f ./kubernetes/flux-system/cluster/platform/rs.yaml

  #  Remove manual trigger for this linting step ( despite naturally fitting in the same workflow)
  #  so it doesnt run on pre-commit hook
  #    when:
  #      - event: push
  #        branch: main

  - name: a-test-step
    image: alpine
    commands:
      - echo "Testing ... "

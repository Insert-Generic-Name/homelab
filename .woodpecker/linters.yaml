variables:
  - &image "192.168.1.60:3000/insert-generic-name/toolbox:latest"

when:
  - event: ["push", "pull_request"]

steps:
  - depends_on: [] # Enable parallel execution on steps
    name: Terraform linting
    image: *image
    commands:
      - mise exec -- tflint --chdir=./terraform --recursive
    when:
      - path:
          include: ["*.tf", "**/*.tf"]

  - name: Cluster resources validation
    image: *image
    commands:
      - >
        mise exec -- flate build all |
        mise exec -- kubeconform
        -verbose
        -output "pretty"
        -summary
        -strict
        -schema-location default
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
    when:
      path: "kubernetes/**"

  - name: Flux operator resources validation
    image: *image
    commands:
      - mise exec -- flux-operator build rset -f ./kubernetes/flux-system/cluster/platform/rs.yaml | mise exec -- flux-schema validate -s ecosystem -v
    when:
      - path: "kubernetes/flux-system/cluster/platform/**"

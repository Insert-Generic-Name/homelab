when:
  - event: ["push", "pull_request"]

steps:
  - name: YAML linters
    image: alpine:3.24.2 #change me to a python based image to download me with pypi instead of apk
    commands:
      - apk add yamllint
      - yamllint .
    when:
      - path:
          include: ["*.yaml", "*.yaml.tmpl"] #broken

  - name: Terraform linters
    image: ghcr.io/terraform-linters/tflint:latest
    commands:
      - tflint --chdir=./terraform --recursive
    when:
      - path:
          include: ["*.tf"] #broken

  - name: Kubernetes schema validation
    image: ghcr.io/yannh/kubeconform:v0.8.0-alpine
    commands:
      # Ignore HelmRelease and ExternalSecret CRDs; Missing schema values due to kustomize patching DRY practises
      - >
        /kubeconform
        -verbose
        -output "pretty"
        -summary
        -strict
        -skip "HelmRelease,ExternalSecret"
        -schema-location default
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
        ./kubernetes
    when:
      path: "kubernetes/**"

  - name: Build FluxCD resources and validate them
    image: ghcr.io/controlplaneio-fluxcd/flux-operator-cli:v0.57.0
    # Shell does not live under /bin/sh which is the default path used by woodpecker
    entrypoint:
      ["/busybox/sh", "-c", "echo $CI_SCRIPT | base64 -d | /busybox/sh -e"]
    commands:
      - flux-operator build rset -f ./kubernetes/flux-system/cluster/platform/rs.yaml | flux schema validate -s ecosystem -v
    when:
      - path: "kubernetes/flux-system/cluster/platform/*"


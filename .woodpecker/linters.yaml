variables:
  - &event_filter
    - push
    - pull_request
    - manual # Allows local CI execution on pre-commit

when:
  - event: *event_filter

steps:
  - name: yamllint
    image: alpine:3.24.2
    commands:
      - apk add yamllint
      - yamllint .
    when:
      - event: *event_filter
        path:
          - "*.yaml"
          - "*.yaml.tmpl"


variables:
  - &image ghcr.io/jdx/mise:2026.10.4-debian

when:
  - event: ["push", "pull_request"]

steps:
  - name: YAML linting
    image: *image
    commands:
      - mise exec uv yamllint --locked -- yamllint .
    when:
      - path:
          include:
            - "*.yaml"
            - "**/*.yaml"
            - "*.yaml.tmpl"
            - "**/*.yaml.tmpl"

  - name: Terraform linting
    image: *image
    commands:
      - mise exec tflint --locked -- tflint --chdir=./terraform --recursive
    when:
      - path:
          include: ["*.tf", "**/*.tf"]

  - name: Cluster resources validation
    image: *image
    commands:
      - >
        mise exec github:home-operations/flate kubeconform --locked -- flate build all |
        mise exec kubeconform --locked --
        -verbose
        -output "pretty"
        -summary
        -strict
        -schema-location default
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
    when:
      path: "kubernetes/**"

  - name: Flux operator validation
    image: *image
    commands:
      - mise exec flux --locked -- flux plugin install schema && flux plugin install operator
      - mise exec flux --locked -- flux operator build rset -f ./kubernetes/flux-system/cluster/platform/rs.yaml | flux schema validate -s ecosystem -v
    when:
      - path: "kubernetes/flux-system/cluster/platform/*"

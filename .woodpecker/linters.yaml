#depends_on
when:
  - event: ["push", "pull_request", "manual"] # manual allows local CI execution on pre-commit

steps:
  - name: yamllint
    image: alpine:3.24.2
    commands:
      - apk add yamllint
      - yamllint .
    when:
      - path:
          include: ["*.yaml", "*.yaml.tmpl"]


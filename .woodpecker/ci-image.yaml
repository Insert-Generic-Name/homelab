  #     - "docker build --progress=plain --no-cache -t $REGISTRY/insert-generic-name/toolbox:$CI_COMMIT_SHA .mise"
  #     - docker push $REGISTRY/insert-generic-name/toolbox:$CI_COMMIT_SHA

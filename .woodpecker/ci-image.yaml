when:
  - event: ["push", "pull_request"]
    path:
      include:
        [".mise/config.ci.toml", ".mise/mise.ci.lock", ".mise/Dockerfile"]

steps:
  - name: dockerd
    image: docker:29.9.3-dind
    detach: true

  - name: Build & push image to registry
    image: docker:29.9.3-cli
    commands:
      - docker build -t ${REGISTRY}/insert-generic-name/toolbox:${CI_COMMIT_TAG} .mise
      - docker push ${REGISTRY}/insert-generic-name/toolbox:${CI_COMMIT_TAG}
    backend_options:
      kubernetes:
        secrets:
          - name: woodpecker
            key: woodpecker-forgejo-registry
            target:
              env: REGISTRY

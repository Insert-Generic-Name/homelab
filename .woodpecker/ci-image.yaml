when:
  - event: ["push", "pull_request"]
    path:
      include:
        [".mise/config.ci.toml", ".mise/mise.ci.lock", ".mise/Dockerfile"]

steps:
  - name: Build & push image to registry
    image: alpine:latest # docker:29.9.2-dind-alpine3.24
    commands:
      - echo "${REGISTRY}"
      - docker build -t ${REGISTRY}/insert-generic-name/toolbox:latest .mise
      - docker push ${REGISTRY}/insert-generic-name/toolbox:latest
    backend_options:
      kubernetes:
        secrets:
          - name: woodpecker
            key: woodpecker-forgejo-registry
            target:
              env: REGISTRY

  - name: Build & push to registry
    image: ghcr.io/osscontainertools/kaniko:latest
    entrypoint: ["/kaniko/executor"]
    commands:
      - >
        --dockerfile=.mise/Dockerfile
        --context=dir:///.mise
        --destination=$REGISTRY:$CI_COMMIT_SHA
    backend_options:
      kubernetes:
        secrets:
          - name: ci
            key: ci-registry
            target:
              env: REGISTRY


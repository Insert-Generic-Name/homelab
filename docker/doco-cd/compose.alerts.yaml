services:
  apprise:
    container_name: doco-cd-notifier
    image: caronc/apprise:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      TZ: ${TZ?:error}
      APPRISE_WORKER_COUNT: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8000/status >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - doco-cd

networks:
  doco-cd:
    name: doco-cd

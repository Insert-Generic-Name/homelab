services:
  app:
    container_name: doco-cd-updater
    image: ghcr.io/kimdre/doco-cd:latest
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      HTTP_PORT: 8080
      DEPLOY_CONFIG_BASE_DIR: ./docker/
      SCHEDULER_ENABLED: false
      POLL_CONFIG: |
        - url: https://github.com/Insert-Generic-Name/homelab.git
          reference: main
          interval: 300
          target: updater
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - updater-data:/data
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - doco-cd

networks:
  doco-cd:
    name: doco-cd

volumes:
  updater-data:

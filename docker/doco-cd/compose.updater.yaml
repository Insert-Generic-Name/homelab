services:
  app:
    container_name: doco-cd-updater
    image: ghcr.io/kimdre/doco-cd:latest
    restart: unless-stopped
    environment:
      APPRISE_API_URL: "http://apprise:8000/notify"
      APPRISE_NOTIFY_URLS: ${APPRISE_NOTIFY_URLS}
      APPRISE_NOTIFY_LEVEL: info

      TZ: ${TZ}
      HTTP_PORT: 8080
      POLL_CONFIG: |
        - url: https://github.com/Insert-Generic-Name/homelab.git
          reference: main
          interval: 300
          target: updater
      SCHEDULER_ENABLED: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - updater-data:/data
    networks:
      - doco-cd-updater
  apprise:
    container_name: doco-cd-notifier
    image: caronc/apprise:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      TZ: ${TZ?:error}
      APPRISE_WORKER_COUNT: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8000/status >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - doco-cd-updater

networks:
  doco-cd-updater:
    name: doco-cd-updater

volumes:
  updater-data:

services:
  app:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:latest
    restart: unless-stopped
    # depends_on:
    #   apprise:
    #     condition: service_healthy
    environment:
      # APPRISE_API_URL: "http://apprise:8000/notify"
      # APPRISE_NOTIFY_URLS: ${APPRISE_NOTIFY_URLS}
      # APPRISE_NOTIFY_LEVEL: info

      SECRET_PROVIDER: bitwarden_sm
      SECRET_PROVIDER_API_URL: https://vault.bitwarden.com/api
      SECRET_PROVIDER_IDENTITY_URL: https://vault.bitwarden.com/identity
      SECRET_PROVIDER_ACCESS_TOKEN: ${SECRET_PROVIDER_ACCESS_TOKEN:?error}

      TZ: Europe/Madrid
      HTTP_PORT: 80
      DEPLOY_CONFIG_BASE_DIR: ./docker/
      MAX_CONCURRENT_DEPLOYMENTS: 10
      POLL_CONFIG: |
        - url: https://github.com/Insert-Generic-Name/homelab.git
          reference: main
          interval: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - doco-cd

  # apprise:
  #   container_name: doco-cd-notifier
  #   image: caronc/apprise:latest
  #   restart: unless-stopped
  #   expose:
  #     - "8000"
  #   environment:
  #     TZ: Europe/Madrid
  #     APPRISE_WORKER_COUNT: 1
  #   healthcheck:
  #     test:
  #       [
  #         "CMD-SHELL",
  #         "curl -fsS http://localhost:8000/status >/dev/null || exit 1",
  #       ]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 20s
  #   networks:
  #     - doco-cd

networks:
  doco-cd:
    name: doco-cd

volumes:
  data:

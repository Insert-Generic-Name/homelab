services:
  app:
    container_name: doco-cd
    image: ghcr.io/kimdre/doco-cd:latest
    restart: unless-stopped
    expose:
      - "80"
      - "9120"
    environment:
      TZ: Europe/Madrid
      LOG_LEVEL: INFO
      DEPLOY_CONFIG_BASE_DIR: ./docker/
      MAX_CONCURRENT_DEPLOYMENTS: 10
      POLL_CONFIG: |
        - url: https://github.com/Insert-Generic-Name/homelab.git
          reference: refs/heads/main
          interval: "10s"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/doco-cd", "healthcheck"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nginx-httproute
spec:
  parentRefs:
    - name: envoy-gateway
      sectionName: http
      namespace: envoy-gateway-system
  hostnames:
    - nginx.home.arpa
  rules:
    - backendRefs:
        - name: nginx-svc
          port: 80

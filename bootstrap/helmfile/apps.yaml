helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true
  forceConflicts: true
  timeout: 1000

bases:
  - default.yaml

defaultInherit: default

releases:
  - name: cilium
    namespace: kube-system

  # Rook/longhorn goes here

  - name: flux-operator
    namespace: flux-system
    # createNamespace: true
    needs: ["kube-system/cilium"]

  - name: flux-instance
    namespace: flux-system
    needs: ["flux-system/flux-operator"]
    disableValidation: true # Avoid breaking deployment due to missing CRDs

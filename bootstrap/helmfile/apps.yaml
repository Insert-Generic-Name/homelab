# Bootstraps core applications that provide a minimal runtime base for the
# cluster. These releases are installed first so the cluster has the resources
# Flux needs before its own reconciliation begins.

helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true
  forceConflicts: true
  timeout: 1000

bases:
  - default.yaml

defaultInherit: default

releases:
  - name: cilium
    namespace: kube-system

  # Rook/longhorn goes here
  # - name: coredns
  #   namespace: kube-system
  #   # needs: ["kube-system/cilium"]

  - name: cert-manager
    namespace: cert-manager
    needs: ["kube-system/cilium"]

  - name: external-secrets
    namespace: external-secrets
    needs: ["cert-manager/cert-manager"]

  - name: flux-operator
    namespace: flux-system
    needs: ["external-secrets/external-secrets"]

  - name: flux-instance
    namespace: flux-system
    needs: ["flux-system/flux-operator"]
    disableValidation: true # Avoid breaking deployment due to missing CRDs

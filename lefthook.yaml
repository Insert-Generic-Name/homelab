pre-commit:
  follow: true # print to stdout
  piped: true # exit on non-critical failure ( Must set for gitleaks )
  jobs:
    - name: Local secret scanning ( only for staged files )
      run: gitleaks git --pre-commit --staged --redact --verbose

    - name: Run basic CI workflow locally
      run: woodpecker-cli exec --backend-engine docker .woodpecker/checks.yaml

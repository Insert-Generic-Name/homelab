- apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
        name: _
        namespace: flux-system
    spec:
    interval: 5m
    driftDetection:
        mode: enabled
    install:
        crds: CreateReplace
    upgrade:
        crds: CreateReplace
        cleanupOnFail: true
        strategy:
        name: RemediateOnFailure
    rollback:
        cleanupOnFail: true

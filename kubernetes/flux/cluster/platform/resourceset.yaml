apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: platform-rs
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "5m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: flux-operator
  inputs:
    - name: cilium
      namespace: kube-system
      source:
        url: oci://quay.io/cilium/charts/cilium
        tag: 1.19.5

    - name: external-secrets
      namespace: external-secrets
      source:
        url: oci://ghcr.io/external-secrets/charts/external-secrets
        tag: 2.8.0

    - name: cert-manager
      namespace: cert-manager
      source:
        url: oci://quay.io/jetstack/charts/cert-manager
        tag: 1.21.0

    - name: envoy-gateway
      namespace: envoy-gateway-system
      source:
        url: oci://docker.io/envoyproxy/gateway-helm
        tag: 1.8.2

    - name: flux-operator
      namespace: flux-system
      source:
        url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
        tag: 0.55.0

    - name: flux-instance
      namespace: flux-system
      source:
        url: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
        tag: 0.54.1

  resources:
    - apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: << inputs.name >>
        namespace: flux-system
      spec:
        wait: true
        interval: 5m
        prune: << get inputs "prune" | default true >>
        deletionPolicy: WaitForTermination
        sourceRef:
          kind: GitRepository
          name: flux-system
          namespace: flux-system
        path: ./kubernetes/deployment/platform/<< inputs.namespace >>/<< inputs.name >>
        targetNamespace: << inputs.namespace >>
        postBuild:
          substituteFrom:
            - kind: Secret
              name: domain
        patches:
          - path: ../../../../../components/templates/release.yaml
            target:
              group: helm.toolkit.fluxcd.io
              kind: HelmRelease

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: << inputs.name >>
        namespace: flux-system
      spec:
        interval: 5m
        url: << inputs.source.url >>
        ref:
          tag: << inputs.source.tag >>
        layerSelector:
          mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
          operation: copy

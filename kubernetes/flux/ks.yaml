apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: flux-configuration
  namespace: flux-system

spec:
  patches:
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata: {}
        spec:
          wait: true
          interval: 5m
          prune: true
          deletionPolicy: WaitForTermination
          sourceRef:
            kind: GitRepository
            name: flux-system
            namespace: flux-system
          postBuild:
            substituteFrom:
              - kind: Secret
                name: flux-patches
                namespace: flux-system
      target:
        kind: Kustomization
        group: kustomize.toolkit.fluxcd.io
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/deployment
  prune: true

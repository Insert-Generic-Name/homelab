apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../templates/standard

labels:
- pairs:
    app: jellyfin
  includeSelectors: true
  includeTemplates: true

namePrefix: jellyfin-

images:
- name: app
  newName: jellyfin/jellyfin
  newTag: "2026052506"

configMapGenerator:
  - name: jellyfin.env
    envs:
      - .env

patches:
  - target:
      kind: Deployment
      name: app 
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8096
  - target:
      kind: Service
      name: app
    patch: |-
      - op: replace
        path: /spec/ports/0/targetPort
        value: 8096
      
  
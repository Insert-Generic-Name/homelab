apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../../templates/statefulset

labels:
- pairs:
    app: jellyfin
  includeSelectors: true
  includeTemplates: true

namePrefix: jellyfin-

images:
- name: app
  newName: jellyfin/jellyfin
  newTag: "2026052506"

configMapGenerator:
  - name: jellyfin.env
    envs:
      - .env

patches:
  - path: ./patches/ports.yaml
    target:
      kind: StatefulSet
      name: app
#  - target:
#      kind: Service
#      name: app
#    patch: |-
#      - op: replace
#        path: /spec/ports/0/targetPort
#        value: 8096
  - path: ./patches/volumes.yaml
    target:
      kind: StatefulSet
      name: app
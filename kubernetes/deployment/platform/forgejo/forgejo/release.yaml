apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  chartRef:
    kind: OCIRepository
    name: forgejo
  values:
    replicaCount: 1
    serviceAccount:
      create: true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - SYS_CHROOT
      privileged: false
      readOnlyRootFilesystem: true
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
    gitea:
      admin:
        username: forgejo
        email: "forgejo@local.domain"
        passwordMode: keepUpdated
      config:
        webhook:
          ALLOWED_HOST_LIST: "external,private" # Allowed since Forgejo is not exposed publicly.
      metrics:
      enabled: false # changeme
      serviceMonitor:
        enabled: false # changeme

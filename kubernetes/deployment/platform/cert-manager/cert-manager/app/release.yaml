apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
  interval: 5m
  values:
    replicaCount: 1 #changemelater to 2
    webhook:
      replicaCount: 1 #changemelater to 3
    cainjector:
      replicaCount: 1 #changemelater to 2
    prometheus:
      enabled: true
      servicemonitor:
        enabled: false # chagemelater
    podDisruptionBudget:
      enabled: true
    crds:
      enabled: true

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
spec:
  chartRef:
    kind: OCIRepository
    name: openbao
  interval: 5m
  values:
    global:
      namespace: openbao
    tlsDisable: true
    serverTelemetry:
      prometheusOperator: false # change me
    server:
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeId: true
      config: |

        # Listeners
        listener "tcp" {
          address          = "0.0.0.0:8200"
          cluster_address  = "0.0.0.0:8201"
          tls_disable      = "true"
          telemetry {
            unauthenticated_metrics_access = "true"
          }
        }

        # Storage
        storage "raft" {
          path    = "/openbao/data"
          node_id = "main"
        }

        # Auditors
        audit "file" "logs" {
          description = "Persistent logging via file path"
          options {
            file_path = "/openbao/logs"
            log_raw   = "false"
          }
        }

        # User lockout policies
        user_lockout "all" {
          lockout_threshold     = "3"
          lockout_duration      = "24h"
          lockout_counter_reset = "24h"
        }
    ui:
      enabled: true
    grafanaDashboard:
      enabled: true
    auditStorage:
      enabled: true
    gateway:
      httpRoute:
        enabled: true
        hosts:
          - ${DOMAIN}
        parentRefs:
          - name: envoy-gateway
            namespace: envoy-gateway-system
            sectionName: https

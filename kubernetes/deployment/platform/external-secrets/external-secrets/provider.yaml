apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-provider
spec:
  provider:
    vault:
      server: "https://vault.external.${DOMAIN}:8201" #change me later
      path: "kubernetes-kv"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token
          namespace: external-secrets
          key: token

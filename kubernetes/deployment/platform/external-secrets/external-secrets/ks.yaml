apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: external-secrets

spec:
  interval: 5m
  targetNamespace: external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/deployment/platform/external-secrets/external-secrets/app
  prune: false

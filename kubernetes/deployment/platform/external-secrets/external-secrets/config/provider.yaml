apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://192.168.1.60"
      path: "kubernetes"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "vault-backend"
          serviceAccountRef:
            name: "vault-backend"
            namespace: external-secrets

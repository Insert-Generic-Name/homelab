apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  values:
    instance:
      cluster:
        networkPolicy: false
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      sync:
        kind: GitRepository
        url: https://github.com/Insert-Generic-Name/homelab
        ref: refs/heads/resourceset-testing #switch me later to refs/heads/main
        path: ./kubernetes/flux-system/cluster/platform
        interval: 1m

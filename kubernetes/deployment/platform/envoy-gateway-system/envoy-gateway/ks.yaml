apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: envoy-gateway

spec:
  interval: 5m
  targetNamespace: envoy-gateway-system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./kubernetes/deployment/platform/envoy-gateway-system/envoy-gateway/app
  prune: false

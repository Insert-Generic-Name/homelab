apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: HelmChart
    name: rook-ceph-cluster
  values:
    monitoring:
      enabled: false #changeme
    cephBlockPools:
      storageClass:
        reclaimPolicy: Retain
    cephFileSystems:
      storageClass:
        reclaimPolicy: Retain
    cephObjectStores:
      storageClass:
        reclaimPolicy: Retain
      # Enable HTTPRoute
    #   route:
    #   # Enable an ingress for the ceph-objectstore
    #   enabled: false
    #   # The ingress port by default will be the object store's "securePort" (if set), or the gateway "port".
    #   # To override those defaults, set this ingress port to the desired port.
    #   # port: 80
    #   # annotations: {}
    #   # host:
    #   #   name: objectstore.example.com
    #   #   path: /
    #   #   pathType: PathPrefix
    #   # parentRefs:
    #   #   - name: internal
    #   #     namespace: kube-system
    #   #     sectionName: https
    cephClusterSpec:
      mon:
        count: 3
      mgr:
        count: 2

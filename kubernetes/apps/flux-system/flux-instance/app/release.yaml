apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-instance
spec:
  chartRef:
    kind: OCIRepository
    name: flux-instance
  interval: 5m
  values:
    sync:
      kind: GitRepository
      url: https://github.com/Insert-Generic-Name/homelab
      ref: refs/heads/main
      path: kubernetes/apps

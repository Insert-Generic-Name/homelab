apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helm
      version: "1.0.1"
      sourceRef:
        kind: GitRepository
        name: flux-system
  values:
    Kind: Deployment

    Image:
      name: jellyfin/jellyfin
      tag: latest

    Ports:
      - name: http
        protocol: TCP
        port: 8096

    # environment:

    VolumeMounts:
      - name: media
        mountPath: /media

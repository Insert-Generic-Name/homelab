apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: ./helm
      version: "1.0.0"
      sourceRef:
        kind: GitRepository
        name: jellyfin
  values:
    kind: Deployment

    image:
      name: jellyfin/jellyfin
      tag: unstable

    ports:
      - name: http
        protocol: TCP
        port: 8096

    # environment:
